version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      APP_ENV: development
      API_KEY: demo-key
    volumes:
      - .:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      PYTHONPATH: /app
      API_URL: http://api:8000/predict
      APP_ENV: development
    depends_on:
      - api
    volumes:
      - .:/app
